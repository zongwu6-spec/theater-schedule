<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>橙天嘉禾剧场档期行事历</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="hero">

<div class="logo">
🎭 橙天嘉禾剧场
</div>

<div class="calendar-btn">
档期行事历
</div>

<div class="hero-content">

<h1>档期行事历</h1>

<div class="venue-tabs">

<button class="tab-btn">
信仰剧场
</button>

<button class="tab-btn active">
360旋转剧场
</button>

</div>

</div>

</header>

<main class="container">

<div class="toolbar">

<button id="prevMonth">
◀ 上个月
</button>

<h2 id="monthTitle"></h2>

<button id="nextMonth">
下个月 ▶
</button>

</div>

<div class="week-header">

<div>周日</div>
<div>周一</div>
<div>周二</div>
<div>周三</div>
<div>周四</div>
<div>周五</div>
<div>周六</div>

</div>

<div id="calendarGrid"
class="calendar-grid">
</div>

</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>

</body>
</html>
